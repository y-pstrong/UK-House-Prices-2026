<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Interactive Map</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --text: #1f2933;
      --accent: #2563eb;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--accent);
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
    }

    header h1 { margin: 0 0 0.25rem; font-size: 2rem; }
    header p  { margin: 0; opacity: 0.9; }

    main {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* The map box. It keeps a nice shape on desktop and phone. */
    .map-wrapper {
      position: relative;
      width: 100%;
      height: 600px;
      border-radius: 12px;
      overflow: hidden;
      background: #e5e7eb;
    }

    .map-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Placeholder text, delete this block once your map is in */
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      color: #6b7280;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: #6b7280;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .map-wrapper { height: 420px; }
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>UK House Prices in 2026</h1>
    <p>Explore the map below!</p>
  </header>

  <main>
    <section class="card">
      <h2>About this map</h2>
      <p>
        Write a short intro here. Say what the map shows, where the data comes
        from, and how to use it (zoom, click on markers, and so on).
      </p>
    </section>

    <section class="card">
      <div class="map-wrapper">
          <iframe title="Average House Prices in the UK, 2026" aria-label="Choropleth map" id="datawrapper-chart-jBdah" src="https://datawrapper.dwcdn.net/jBdah/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="869" data-external="1"></iframe><script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
      </div>
    </section>

    <section class="card">
      <h2>Notes</h2>
      <p>Add sources, credits or extra details here.</p>
    </section>
  </main>

  <footer>
    &copy; 2026 Sayan, Santiago, Yara
  </footer>

</body>
</html>
